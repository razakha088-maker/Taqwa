name: Taqwa Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        run: echo "${{ secrets.TAQWA_KEYSTORE_BASE64 }}" | base64 --decode > taqwa-release.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed Release AAB
        env:
          TAQWA_KEYSTORE_PASSWORD: ${{ secrets.TAQWA_KEYSTORE_PASSWORD }}
          TAQWA_KEY_ALIAS: ${{ secrets.TAQWA_KEY_ALIAS }}
          TAQWA_KEY_PASSWORD: ${{ secrets.TAQWA_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/taqwa-release.jks" \
            -Pandroid.injected.signing.store.password="$TAQWA_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$TAQWA_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$TAQWA_KEY_PASSWORD"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Taqwa-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
































